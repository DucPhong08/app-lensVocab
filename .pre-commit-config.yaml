repos:
  # 1. Các kiểm tra cơ bản về whitespace, newline, định dạng file cấu hình
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5120']

  # 2. Ruff: Linter (thay thế Flake8 / isort) và Formatter (thay thế Black / Prettier)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
