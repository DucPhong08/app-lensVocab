[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "mongodata",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (tự động gom nhóm và sắp xếp import)
    "UP",   # pyupgrade (khuyên dùng syntax Python 3.12 hiện đại)
]
ignore = [
    "E501", # Bỏ qua line-too-long để ruff-format tự xử lý
    "UP007", # Cho phép Optional / Union nếu cần
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
